<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VMINVEST</title>
<link rel="canonical" href="https://vminvest.nl/nl/">
<link rel="alternate" hreflang="nl" href="https://vminvest.nl/nl/">
<link rel="alternate" hreflang="en" href="https://vminvest.nl/en/">
<link rel="alternate" hreflang="x-default" href="https://vminvest.nl/">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<script>
  // The old one-page site used ?lang=en and #anchors. Send those links to the matching new pages;
  // everything else goes to the Dutch home page, as in the approved package.
  (function () {
    var lang = /[?&]lang=en\b/.test(location.search) ? 'en' : 'nl';
    var old = {
      'over-ons': 'index.html',
      'projecten': 'index.html#expertise',
      'logistiek': 'logistics-industrial.html',
      'contact': 'contact.html'
    };
    var target = old[location.hash.slice(1)] || 'index.html';
    location.replace(lang + '/' + target);
  })();
</script>
<meta http-equiv="refresh" content="0;url=nl/index.html">
</head>
<body>
<a href="nl/index.html">Nederlands</a> · <a href="en/index.html">English</a>
</body>
</html>
